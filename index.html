<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Page Remover — DiagnoBuddy Tool</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;padding:20px}
  .container{max-width:850px;margin:0 auto}
  h1{font-size:22px;color:#06b6d4;margin-bottom:4px}
  .sub{color:#94a3b8;font-size:13px;margin-bottom:20px}
  .drop{border:2px dashed #334155;border-radius:12px;padding:36px 20px;text-align:center;cursor:pointer;background:#1e293b;margin-bottom:16px;transition:0.2s}
  .drop:hover,.drop.over{border-color:#06b6d4;background:#1e293b99}
  .drop p{color:#94a3b8;font-size:14px}
  .drop .icon{font-size:40px;margin-bottom:6px}
  .row{display:flex;gap:12px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
  label{color:#94a3b8;font-size:13px}
  input[type=number]{width:55px;padding:6px;border-radius:6px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-size:14px;text-align:center}
  .btn{padding:9px 20px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:0.2s}
  .btn:disabled{opacity:0.4;cursor:not-allowed}
  .go{background:#06b6d4;color:#0f172a}.go:hover:not(:disabled){background:#22d3ee}
  .dl{background:#10b981;color:#fff}.dl:hover{background:#34d399}
  .clr{background:#ef4444;color:#fff;font-size:12px;padding:7px 14px}
  .bar{width:100%;height:5px;background:#334155;border-radius:3px;margin-bottom:14px;overflow:hidden}
  .fill{height:100%;background:#06b6d4;transition:width 0.3s;border-radius:3px}
  .stats{display:flex;gap:20px;margin-bottom:14px}
  .stat-n{font-size:26px;font-weight:700;color:#06b6d4}
  .stat-l{font-size:11px;color:#64748b}
  .item{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:10px 14px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
  .fname{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:380px}
  .finfo{font-size:11px;color:#64748b;margin-top:2px}
  .badge{font-size:10px;padding:3px 8px;border-radius:4px;font-weight:600}
  .b-ok{background:#10b98133;color:#10b981}
  .b-err{background:#ef444433;color:#ef4444}
  .b-wait{background:#f59e0b33;color:#f59e0b}
  .actions{display:flex;gap:6px;align-items:center}
  .dbtn{background:#10b981;color:#fff;border:none;padding:5px 10px;border-radius:6px;font-size:11px;cursor:pointer;font-weight:600}
  .foot{text-align:center;color:#475569;font-size:11px;margin-top:28px}
  .err-box{background:#ef444422;border:1px solid #ef4444;color:#fca5a5;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px}
  .ok-box{background:#10b98122;border:1px solid #10b981;color:#6ee7b7;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px}
  input[type=file]{display:none}
</style>
</head>
<body>
<div class="container">
  <h1>📄 PDF Single/Bulk Page Remover</h1>
  <p class="sub">Upload PDFs and remove any pages — first, last, or custom range</p>
  
  <div id="status"></div>
  
  <div class="drop" id="drop">
    <p class="icon">📁</p>
    <p>Click or drag & drop PDFs here</p>
    <p style="font-size:11px;color:#64748b;margin-top:4px">You can select multiple PDFs</p>
  </div>
  <input type="file" id="fin" accept=".pdf" multiple>

  <div class="row">
    <label>Remove from start:</label>
    <input type="number" id="rf" min="0" max="10" value="1">
    <label>Remove from end:</label>
    <input type="number" id="rl" min="0" max="10" value="1">
    <button class="btn go" id="goBtn" disabled>🚀 Process All</button>
    <button class="btn dl" id="dlAll" style="display:none">⬇️ Download All</button>
    <button class="btn clr" id="clrBtn" style="display:none">🗑️ Clear</button>
  </div>

  <div class="bar" id="pbar" style="display:none"><div class="fill" id="pfill"></div></div>
  
  <div class="stats" id="stats" style="display:none">
    <div><div class="stat-n" id="stTotal">0</div><div class="stat-l">Total</div></div>
    <div><div class="stat-n" id="stDone">0</div><div class="stat-l">Done</div></div>
    <div><div class="stat-n" id="stErr">0</div><div class="stat-l">Errors</div></div>
  </div>

  <div id="list"></div>
  
  <div class="foot">Everything runs locally in your browser — no data is uploaded | DiagnoBuddy Tool</div>
</div>

<script>
// Load pdf-lib dynamically with error handling
const script = document.createElement('script');
script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js';
script.onload = () => showStatus('✅ PDF library loaded — ready to use!', 'ok');
script.onerror = () => showStatus('❌ PDF library failed to load. Check internet and refresh.', 'err');
document.head.appendChild(script);

let files = [];
let results = [];

const $ = id => document.getElementById(id);
const drop = $('drop'), fin = $('fin'), goBtn = $('goBtn'), dlAll = $('dlAll'), clrBtn = $('clrBtn');

function showStatus(msg, type) {
  $('status').innerHTML = type === 'err' 
    ? `<div class="err-box">${msg}</div>` 
    : type === 'ok' ? `<div class="ok-box">${msg}</div>` : '';
  if(type === 'ok') setTimeout(() => $('status').innerHTML = '', 3000);
}

// Drop zone
drop.onclick = () => fin.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); addFiles(e.dataTransfer.files); };
fin.onchange = () => { addFiles(fin.files); fin.value = ''; };

function addFiles(fl) {
  let added = 0;
  for(const f of fl) {
    if(f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf')) {
      files.push(f);
      results.push(null);
      added++;
    }
  }
  if(added === 0) showStatus('❌ Please select PDF files only!', 'err');
  else showStatus(`✅ ${added} PDF(s) added!`, 'ok');
  updateUI();
}

function updateUI() {
  const doneCount = results.filter(r => r && r.ok).length;
  const errCount = results.filter(r => r && !r.ok).length;
  
  goBtn.disabled = files.length === 0;
  goBtn.textContent = `🚀 Process All (${files.length})`;
  dlAll.style.display = doneCount > 0 ? '' : 'none';
  clrBtn.style.display = files.length > 0 ? '' : 'none';
  
  if(files.length > 0) {
    $('stats').style.display = 'flex';
    $('stTotal').textContent = files.length;
    $('stDone').textContent = doneCount;
    $('stErr').textContent = errCount;
  } else {
    $('stats').style.display = 'none';
  }
  
  let html = '';
  files.forEach((f, i) => {
    const r = results[i];
    const sz = (f.size/1024).toFixed(1);
    let badge = '<span class="badge b-wait">Pending</span>';
    let dlbtn = '';
    if(r) {
      if(r.ok) {
        badge = '<span class="badge b-ok">✓ Done</span>';
        dlbtn = `<button class="dbtn" onclick="dlOne(${i})">⬇️</button>`;
      } else {
        badge = `<span class="badge b-err">✗ ${r.error}</span>`;
      }
    }
    html += `<div class="item">
      <div>
        <div class="fname">${f.name}</div>
        <div class="finfo">${sz} KB ${r && r.ok ? '→ ' + r.pages + ' pages' : ''}</div>
      </div>
      <div class="actions">${badge} ${dlbtn}</div>
    </div>`;
  });
  $('list').innerHTML = html;
}

// Process
goBtn.onclick = async () => {
  if(typeof PDFLib === 'undefined') {
    showStatus('❌ PDF library abhi load nahi hua. Page refresh karo.', 'err');
    return;
  }
  
  const rf = parseInt($('rf').value) || 0;
  const rl = parseInt($('rl').value) || 0;
  
  goBtn.disabled = true;
  goBtn.textContent = '⏳ Processing...';
  $('pbar').style.display = '';
  
  for(let i = 0; i < files.length; i++) {
    if(results[i] && results[i].ok) continue; // skip already done
    
    try {
      const buf = await files[i].arrayBuffer();
      const pdf = await PDFLib.PDFDocument.load(buf, { ignoreEncryption: true });
      const total = pdf.getPageCount();
      
      if(total <= rf + rl) {
        results[i] = { ok: false, error: `${total} pages only` };
        updateProgress(i);
        continue;
      }
      
      const newPdf = await PDFLib.PDFDocument.create();
      const indices = [];
      for(let p = rf; p < total - rl; p++) indices.push(p);
      
      const copied = await newPdf.copyPages(pdf, indices);
      copied.forEach(p => newPdf.addPage(p));
      
      const bytes = await newPdf.save();
      results[i] = { ok: true, bytes: bytes, pages: indices.length };
    } catch(e) {
      results[i] = { ok: false, error: e.message.substring(0, 30) };
    }
    updateProgress(i);
  }
  
  goBtn.disabled = false;
  goBtn.textContent = `🚀 Process All (${files.length})`;
  $('pbar').style.display = 'none';
  
  const done = results.filter(r => r && r.ok).length;
  if(done > 0) showStatus(`✅ ${done}/${files.length} PDFs successfully processed!`, 'ok');
  updateUI();
};

function updateProgress(i) {
  const pct = ((i + 1) / files.length * 100);
  $('pfill').style.width = pct + '%';
  updateUI();
}

// Download
function dlOne(i) {
  const r = results[i];
  if(!r || !r.bytes) return;
  const blob = new Blob([r.bytes], { type: 'application/pdf' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const name = files[i].name.replace(/\.pdf$/i, '') + '_cleaned.pdf';
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

dlAll.onclick = () => {
  let delay = 0;
  results.forEach((r, i) => {
    if(r && r.ok) { setTimeout(() => dlOne(i), delay); delay += 400; }
  });
};

// Clear
clrBtn.onclick = () => {
  files = []; results = [];
  $('status').innerHTML = '';
  $('pbar').style.display = 'none';
  updateUI();
};

updateUI();
</script>
</body>
</html>
